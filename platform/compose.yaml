name: bearvoice

services:
  db:
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  cache:
    image: valkey/valkey:9.1.1-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.29.7
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: db
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    ports:
      - "127.0.0.1:7233:7233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.53.3
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:4173
    ports:
      - "127.0.0.1:8233:8080"
    restart: unless-stopped

  api:
    build:
      context: ./backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
    environment:
      BEARVOICE_DATABASE_URL: ${BEARVOICE_DATABASE_URL}
      BEARVOICE_TEMPORAL_ADDRESS: ${BEARVOICE_TEMPORAL_ADDRESS}
      BEARVOICE_CACHE_URL: ${BEARVOICE_CACHE_URL}
      BEARVOICE_MODEL_EGRESS_ENABLED: ${BEARVOICE_MODEL_EGRESS_ENABLED}
      BEARVOICE_MODEL_PROVIDER_ALLOWLIST: ${BEARVOICE_MODEL_PROVIDER_ALLOWLIST:-[]}
      BEARVOICE_MODEL_PURPOSE_ALLOWLIST: ${BEARVOICE_MODEL_PURPOSE_ALLOWLIST:-[]}
      BEARVOICE_MODEL_ENDPOINT_ALLOWLIST: ${BEARVOICE_MODEL_ENDPOINT_ALLOWLIST:-[]}
      BEARVOICE_MODEL_REQUEST_TIMEOUT_SECONDS: ${BEARVOICE_MODEL_REQUEST_TIMEOUT_SECONDS:-45}
      BEARVOICE_SEMANTIC_BATCH_SIZE: ${BEARVOICE_SEMANTIC_BATCH_SIZE:-20}
      BEARVOICE_SEMANTIC_MAX_CONCURRENCY: ${BEARVOICE_SEMANTIC_MAX_CONCURRENCY:-4}
      BEARVOICE_SEMANTIC_RETRY_MAX_ATTEMPTS: ${BEARVOICE_SEMANTIC_RETRY_MAX_ATTEMPTS:-3}
      BEARVOICE_SEMANTIC_RETRY_INITIAL_SECONDS: ${BEARVOICE_SEMANTIC_RETRY_INITIAL_SECONDS:-1}
      BEARVOICE_MODEL_JOB_MAX_CALLS: ${BEARVOICE_MODEL_JOB_MAX_CALLS:-500}
      BEARVOICE_MODEL_DAILY_MAX_CALLS: ${BEARVOICE_MODEL_DAILY_MAX_CALLS:-5000}
      BEARVOICE_MODEL_JOB_BUDGET_RMB: ${BEARVOICE_MODEL_JOB_BUDGET_RMB:-50}
      BEARVOICE_MODEL_DAILY_BUDGET_RMB: ${BEARVOICE_MODEL_DAILY_BUDGET_RMB:-500}
      BEARVOICE_MODEL_RESERVED_COST_PER_CALL_RMB: ${BEARVOICE_MODEL_RESERVED_COST_PER_CALL_RMB:-0.05}
      BEARVOICE_DEEPSEEK_API_KEY: ${BEARVOICE_DEEPSEEK_API_KEY:-}
      BEARVOICE_DEEPSEEK_BASE_URL: ${BEARVOICE_DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      BEARVOICE_DEEPSEEK_MODEL: ${BEARVOICE_DEEPSEEK_MODEL:-deepseek-v4-pro}
      BEARVOICE_GLM_API_KEY: ${BEARVOICE_GLM_API_KEY:-}
      BEARVOICE_GLM_BASE_URL: ${BEARVOICE_GLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      BEARVOICE_GLM_MODEL: ${BEARVOICE_GLM_MODEL:-glm-5.2}
      BEARVOICE_MINIMAX_API_KEY: ${BEARVOICE_MINIMAX_API_KEY:-}
      BEARVOICE_MINIMAX_BASE_URL: ${BEARVOICE_MINIMAX_BASE_URL:-https://api.minimaxi.com/v1}
      BEARVOICE_MINIMAX_MODEL: ${BEARVOICE_MINIMAX_MODEL:-MiniMax-M3}
      BEARVOICE_QWEN_API_KEY: ${BEARVOICE_QWEN_API_KEY:-}
      BEARVOICE_QWEN_BASE_URL: ${BEARVOICE_QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      BEARVOICE_QWEN_MODEL: ${BEARVOICE_QWEN_MODEL:-qwen3.8-max}
      BEARVOICE_CUSTOM_AI_API_KEY: ${BEARVOICE_CUSTOM_AI_API_KEY:-}
      BEARVOICE_CUSTOM_AI_BASE_URL: ${BEARVOICE_CUSTOM_AI_BASE_URL:-}
      BEARVOICE_CUSTOM_AI_MODEL: ${BEARVOICE_CUSTOM_AI_MODEL:-}
      BEARVOICE_RUNTIME_ENVIRONMENT: ${BEARVOICE_RUNTIME_ENVIRONMENT:-production}
      BEARVOICE_LOCAL_DEV_SESSION_ENABLED: ${BEARVOICE_LOCAL_DEV_SESSION_ENABLED:-false}
      BEARVOICE_LOCAL_DEV_SESSION_TTL_SECONDS: ${BEARVOICE_LOCAL_DEV_SESSION_TTL_SECONDS:-3600}
      BEARVOICE_MAX_UPLOAD_BYTES: ${BEARVOICE_MAX_UPLOAD_BYTES:-10485760}
      BEARVOICE_STORAGE_BACKEND: ${BEARVOICE_STORAGE_BACKEND}
      BEARVOICE_OBJECT_STORE_ROOT: ${BEARVOICE_OBJECT_STORE_ROOT}
      BEARVOICE_S3_ENDPOINT_URL: ${BEARVOICE_S3_ENDPOINT_URL:-}
      BEARVOICE_S3_ENDPOINT_ALLOWLIST: ${BEARVOICE_S3_ENDPOINT_ALLOWLIST:-[]}
      BEARVOICE_S3_BUCKET: ${BEARVOICE_S3_BUCKET:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./.data/objects:/var/lib/bearvoice/objects
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    init: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      BEARVOICE_DATABASE_URL: ${BEARVOICE_DATABASE_URL}

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "bearvoice.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
    environment:
      BEARVOICE_DATABASE_URL: ${BEARVOICE_DATABASE_URL}
      BEARVOICE_TEMPORAL_ADDRESS: ${BEARVOICE_TEMPORAL_ADDRESS}
      BEARVOICE_CACHE_URL: ${BEARVOICE_CACHE_URL}
      BEARVOICE_MODEL_EGRESS_ENABLED: ${BEARVOICE_MODEL_EGRESS_ENABLED}
      BEARVOICE_MODEL_PROVIDER_ALLOWLIST: ${BEARVOICE_MODEL_PROVIDER_ALLOWLIST:-[]}
      BEARVOICE_MODEL_PURPOSE_ALLOWLIST: ${BEARVOICE_MODEL_PURPOSE_ALLOWLIST:-[]}
      BEARVOICE_MODEL_ENDPOINT_ALLOWLIST: ${BEARVOICE_MODEL_ENDPOINT_ALLOWLIST:-[]}
      BEARVOICE_MODEL_REQUEST_TIMEOUT_SECONDS: ${BEARVOICE_MODEL_REQUEST_TIMEOUT_SECONDS:-45}
      BEARVOICE_SEMANTIC_BATCH_SIZE: ${BEARVOICE_SEMANTIC_BATCH_SIZE:-20}
      BEARVOICE_SEMANTIC_MAX_CONCURRENCY: ${BEARVOICE_SEMANTIC_MAX_CONCURRENCY:-4}
      BEARVOICE_SEMANTIC_RETRY_MAX_ATTEMPTS: ${BEARVOICE_SEMANTIC_RETRY_MAX_ATTEMPTS:-3}
      BEARVOICE_SEMANTIC_RETRY_INITIAL_SECONDS: ${BEARVOICE_SEMANTIC_RETRY_INITIAL_SECONDS:-1}
      BEARVOICE_MODEL_JOB_MAX_CALLS: ${BEARVOICE_MODEL_JOB_MAX_CALLS:-500}
      BEARVOICE_MODEL_DAILY_MAX_CALLS: ${BEARVOICE_MODEL_DAILY_MAX_CALLS:-5000}
      BEARVOICE_MODEL_JOB_BUDGET_RMB: ${BEARVOICE_MODEL_JOB_BUDGET_RMB:-50}
      BEARVOICE_MODEL_DAILY_BUDGET_RMB: ${BEARVOICE_MODEL_DAILY_BUDGET_RMB:-500}
      BEARVOICE_MODEL_RESERVED_COST_PER_CALL_RMB: ${BEARVOICE_MODEL_RESERVED_COST_PER_CALL_RMB:-0.05}
      BEARVOICE_DEEPSEEK_API_KEY: ${BEARVOICE_DEEPSEEK_API_KEY:-}
      BEARVOICE_DEEPSEEK_BASE_URL: ${BEARVOICE_DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      BEARVOICE_DEEPSEEK_MODEL: ${BEARVOICE_DEEPSEEK_MODEL:-deepseek-v4-pro}
      BEARVOICE_GLM_API_KEY: ${BEARVOICE_GLM_API_KEY:-}
      BEARVOICE_GLM_BASE_URL: ${BEARVOICE_GLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      BEARVOICE_GLM_MODEL: ${BEARVOICE_GLM_MODEL:-glm-5.2}
      BEARVOICE_MINIMAX_API_KEY: ${BEARVOICE_MINIMAX_API_KEY:-}
      BEARVOICE_MINIMAX_BASE_URL: ${BEARVOICE_MINIMAX_BASE_URL:-https://api.minimaxi.com/v1}
      BEARVOICE_MINIMAX_MODEL: ${BEARVOICE_MINIMAX_MODEL:-MiniMax-M3}
      BEARVOICE_QWEN_API_KEY: ${BEARVOICE_QWEN_API_KEY:-}
      BEARVOICE_QWEN_BASE_URL: ${BEARVOICE_QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      BEARVOICE_QWEN_MODEL: ${BEARVOICE_QWEN_MODEL:-qwen3.8-max}
      BEARVOICE_CUSTOM_AI_API_KEY: ${BEARVOICE_CUSTOM_AI_API_KEY:-}
      BEARVOICE_CUSTOM_AI_BASE_URL: ${BEARVOICE_CUSTOM_AI_BASE_URL:-}
      BEARVOICE_CUSTOM_AI_MODEL: ${BEARVOICE_CUSTOM_AI_MODEL:-}
      BEARVOICE_RUNTIME_ENVIRONMENT: ${BEARVOICE_RUNTIME_ENVIRONMENT:-production}
      BEARVOICE_STORAGE_BACKEND: ${BEARVOICE_STORAGE_BACKEND}
      BEARVOICE_OBJECT_STORE_ROOT: ${BEARVOICE_OBJECT_STORE_ROOT}
    init: true
    security_opt:
      - no-new-privileges:true
    restart: on-failure

  web:
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:4173:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  postgres-data:
