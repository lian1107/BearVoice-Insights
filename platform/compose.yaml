name: bearvoice

services:
  db:
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  cache:
    image: valkey/valkey:9.1.1-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  temporal:
    image: temporalio/auto-setup:1.29.7
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: db
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.53.3
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:4173
    ports:
      - "8233:8080"

  api:
    build:
      context: ./backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_started
      cache:
        condition: service_healthy
    environment:
      BEARVOICE_DATABASE_URL: ${BEARVOICE_DATABASE_URL}
      BEARVOICE_TEMPORAL_ADDRESS: ${BEARVOICE_TEMPORAL_ADDRESS}
      BEARVOICE_CACHE_URL: ${BEARVOICE_CACHE_URL}
      BEARVOICE_MODEL_EGRESS_ENABLED: ${BEARVOICE_MODEL_EGRESS_ENABLED}
      BEARVOICE_STORAGE_BACKEND: ${BEARVOICE_STORAGE_BACKEND}
      BEARVOICE_OBJECT_STORE_ROOT: ${BEARVOICE_OBJECT_STORE_ROOT}
      BEARVOICE_S3_ENDPOINT_URL: ${BEARVOICE_S3_ENDPOINT_URL:-}
      BEARVOICE_S3_ENDPOINT_ALLOWLIST: ${BEARVOICE_S3_ENDPOINT_ALLOWLIST:-[]}
      BEARVOICE_S3_BUCKET: ${BEARVOICE_S3_BUCKET:-}
    ports:
      - "8000:8000"
    volumes:
      - ./.data/objects:/var/lib/bearvoice/objects

  migrate:
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      BEARVOICE_DATABASE_URL: ${BEARVOICE_DATABASE_URL}

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "bearvoice.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_started
    environment:
      BEARVOICE_DATABASE_URL: ${BEARVOICE_DATABASE_URL}
      BEARVOICE_TEMPORAL_ADDRESS: ${BEARVOICE_TEMPORAL_ADDRESS}
      BEARVOICE_CACHE_URL: ${BEARVOICE_CACHE_URL}
      BEARVOICE_MODEL_EGRESS_ENABLED: ${BEARVOICE_MODEL_EGRESS_ENABLED}
    restart: on-failure

  web:
    build:
      context: ./frontend
    depends_on:
      - api
    ports:
      - "4173:8080"

volumes:
  postgres-data:
