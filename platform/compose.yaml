name: bearvoice

services:
  db:
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  cache:
    image: valkey/valkey:9.1.1-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.29.7
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: db
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    ports:
      - "127.0.0.1:7233:7233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.53.3
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:4173
    ports:
      - "127.0.0.1:8233:8080"
    restart: unless-stopped

  api:
    build:
      context: ./backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
    environment:
      BEARVOICE_DATABASE_URL: ${BEARVOICE_DATABASE_URL}
      BEARVOICE_TEMPORAL_ADDRESS: ${BEARVOICE_TEMPORAL_ADDRESS}
      BEARVOICE_CACHE_URL: ${BEARVOICE_CACHE_URL}
      BEARVOICE_MODEL_EGRESS_ENABLED: ${BEARVOICE_MODEL_EGRESS_ENABLED}
      BEARVOICE_RUNTIME_ENVIRONMENT: ${BEARVOICE_RUNTIME_ENVIRONMENT:-production}
      BEARVOICE_LOCAL_DEV_SESSION_ENABLED: ${BEARVOICE_LOCAL_DEV_SESSION_ENABLED:-false}
      BEARVOICE_LOCAL_DEV_SESSION_TTL_SECONDS: ${BEARVOICE_LOCAL_DEV_SESSION_TTL_SECONDS:-3600}
      BEARVOICE_MAX_UPLOAD_BYTES: ${BEARVOICE_MAX_UPLOAD_BYTES:-10485760}
      BEARVOICE_STORAGE_BACKEND: ${BEARVOICE_STORAGE_BACKEND}
      BEARVOICE_OBJECT_STORE_ROOT: ${BEARVOICE_OBJECT_STORE_ROOT}
      BEARVOICE_S3_ENDPOINT_URL: ${BEARVOICE_S3_ENDPOINT_URL:-}
      BEARVOICE_S3_ENDPOINT_ALLOWLIST: ${BEARVOICE_S3_ENDPOINT_ALLOWLIST:-[]}
      BEARVOICE_S3_BUCKET: ${BEARVOICE_S3_BUCKET:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./.data/objects:/var/lib/bearvoice/objects
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    init: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      BEARVOICE_DATABASE_URL: ${BEARVOICE_DATABASE_URL}

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "bearvoice.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
    environment:
      BEARVOICE_DATABASE_URL: ${BEARVOICE_DATABASE_URL}
      BEARVOICE_TEMPORAL_ADDRESS: ${BEARVOICE_TEMPORAL_ADDRESS}
      BEARVOICE_CACHE_URL: ${BEARVOICE_CACHE_URL}
      BEARVOICE_MODEL_EGRESS_ENABLED: ${BEARVOICE_MODEL_EGRESS_ENABLED}
      BEARVOICE_RUNTIME_ENVIRONMENT: ${BEARVOICE_RUNTIME_ENVIRONMENT:-production}
      BEARVOICE_STORAGE_BACKEND: ${BEARVOICE_STORAGE_BACKEND}
      BEARVOICE_OBJECT_STORE_ROOT: ${BEARVOICE_OBJECT_STORE_ROOT}
    init: true
    security_opt:
      - no-new-privileges:true
    restart: on-failure

  web:
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:4173:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  postgres-data:
