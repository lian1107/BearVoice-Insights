[project]
name = "bearvoice"
version = "0.1.0"
description = "小熊电器内部客户原声产品机会平台"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.19.1",
  "asyncpg>=0.31.0",
  "fastapi",
  "pgvector>=0.5.0",
  "pyjwt[crypto]>=2.10.1",
  "pydantic-settings",
  "python-multipart>=0.0.20",
  "sqlalchemy[asyncio]>=2.0.52",
  "temporalio>=1.31.0",
  "uvicorn[standard]",
  "jinja2>=3.1.6",
]

[dependency-groups]
dev = [
  "httpx",
  "httpx2>=2.10.0",
  "pytest",
  "pytest-asyncio",
  "ruff>=0.16.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bearvoice"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008"]
